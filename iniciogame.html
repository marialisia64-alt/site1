<!doctype html>
<html lang="pt-br">
    <head>
        <title>Curso de Javascript</title>
    <meta charset="UTF-8">
    <style>
    #jogador{
        position:absolute;
        left:0px;
        top:0px;
        width:50px;
        height:50px;
        background-color: #000;
    }    
   </style>
  <script>
   var px=0;
   var py=0;
   function load(){
    document.addEventListener("keydown", tecla);
   }    
   function tecla(){
    var jg=document.getElementById("jogador");
    var tecla = event.keyCode;
    if(tecla==65){
    //Esquerda
    px-=10;
    jg.style.left=px+"px";
    }else if(tecla==68){
    //Direita
    px+=10;
    jg.style.left=px+"px";    
    }
    if(tecla==87){
    //Cima
    py-=10;
    jg.style.top=py+"px";
    
    }else if(tecla==83){
    //Baixo
    py+=10;
    jg.style.top=py+"px";    
    }   
    }
    window.addEventListener("load", load);
 
  </script>
  
</head>

    <body>
        <div id="jogador"></div>
    </body>
    </html>
